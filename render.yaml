services:
  - type: web
    name: foodlens-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YOLO_CONFIG_DIR
        value: /tmp/ultralytics_config
      - key: MODEL_PATH
        value: models/foodlens_yolo11s_best.pt
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: DATABASE_URL
        sync: false   # Set this secret manually in Render dashboard → Environment

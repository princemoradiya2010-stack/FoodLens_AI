<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="description" content="Explore your FoodLens meal and nutrition history." /><title>FoodLens AI · Meal History</title><link rel="stylesheet" href="css/global.css" /><link rel="stylesheet" href="css/history.css" /></head>
<body data-page="history">
  <header class="topbar"><nav class="navbar container" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="brand-icon">◉</span><span class="brand-copy"><strong>FOODLENS AI</strong><small>SMART NUTRITION</small></span></a>
    <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu"><span></span><span></span><span></span></button>
    <div class="nav-menu" id="nav-menu"><a data-page="dashboard" href="index.html">Dashboard</a><a data-page="scan" href="scan.html">Scan Food</a><a data-page="today" href="today.html">Today's Meals</a><a data-page="history" href="history.html">History</a><a data-page="insights" href="insights.html">Insights</a></div>
    <div class="nav-actions"><span class="today-indicator"><span class="today-indicator-dot"></span><span id="today-date">Today</span></span><a class="profile-button" href="profile.html" aria-label="Profile and nutrition goals">F</a></div>
  </nav></header>
  <main class="container page-content"><section class="page-heading"><span class="eyebrow">Your food log</span><h1>Meal History</h1><p>Track your nutrition over time.</p></section>
    <section class="section-block"><div class="section-heading section-heading-row"><div><span class="eyebrow">Past meals</span><h2>All your meals</h2></div><label class="history-filter-label" for="history-filter">Show <select id="history-filter" class="history-filter"><option value="all">All time</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This week</option><option value="month">This month</option><option value="custom">Custom dates</option></select></label></div>
      <div id="custom-date-filter" class="custom-date-filter" hidden><label>From <input id="history-date-from" type="date" /></label><label>To <input id="history-date-to" type="date" /></label></div><div id="history-list" class="history-list"><div class="loading-state">Loading meal history…</div></div>
    </section>
  </main><footer class="site-footer"><div class="container"><a href="about.html">About FoodLens AI</a><span>Nutrition estimates are informational and may vary.</span></div></footer>
  <div id="meal-modal" class="modal hidden" aria-hidden="true"><div class="modal-backdrop" data-close-meal-modal></div><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="meal-modal-title"><button class="modal-close" aria-label="Close meal details">×</button><span class="eyebrow">Meal details</span><h3 id="meal-modal-title">Meal details</h3><p id="meal-modal-date" class="history-meta"></p><div id="meal-modal-foods" class="meal-modal-foods"></div><div id="meal-modal-nutrition" class="modal-info-grid"></div></div></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/api.js"></script><script src="js/global.js"></script><script src="js/history.js"></script>
</body></html>
